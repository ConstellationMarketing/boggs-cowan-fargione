<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Playfair+Display:wght@600&display=swap" rel="stylesheet" media="print" onload="this.media='all'" />
    <noscript><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Playfair+Display:wght@600&display=swap" rel="stylesheet" /></noscript>
  </head>

  <body>
    <form name="contact" netlify netlify-honeypot="bot-field" hidden>
      <!-- Core contact fields -->
      <input type="hidden" name="form-name" />
      <input type="text" name="firstName" />
      <input type="text" name="lastName" />
      <input type="tel" name="phone" />
      <input type="email" name="email" />
      <input type="text" name="zipCode" />
      <select name="caseType">
        <option>Car Accidents</option>
        <option>Child Custody</option>
        <option>Divorce</option>
        <option>Dog Bites</option>
        <option>Family Law</option>
        <option>Fraud</option>
        <option>Medical Malpractice</option>
        <option>Motorcycle Accidents</option>
        <option>Personal Injury</option>
        <option>Property Disputes</option>
        <option>Slip &amp; Fall</option>
        <option>Truck Accidents</option>
        <option>Workplace Injuries</option>
        <option>Wrongful Death</option>
        <option>Other / Unsure</option>
      </select>
      <!-- Spam protection -->
      <input type="text" name="bot-field" />
      <!-- UTM / tracking fields -->
      <input type="hidden" name="utm_source" />
      <input type="hidden" name="utm_medium" />
      <input type="hidden" name="utm_campaign" />
      <input type="hidden" name="utm_term" />
      <input type="hidden" name="utm_content" />
      <input type="hidden" name="landing_page" />
      <input type="hidden" name="submission_page" />
      <input type="hidden" name="referrer" />
      <input type="hidden" name="gclid" />
      <input type="hidden" name="fbclid" />
      <input type="hidden" name="msclkid" />
      <input type="hidden" name="gbraid" />
      <input type="hidden" name="wbraid" />
    </form>

    <div id="root"></div>

    <script type="module" src="/client/App.tsx"></script>
  </body>
</html>
